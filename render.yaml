services:
  - type: web
    name: nexuspf-crm-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: PORT
        value: 4400
      - key: DATABASE_URL
        fromDatabase:
          name: nexuspf-crm-db
          property: connectionString

  - type: web
    name: nexuspf-crm-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      - key: PORT
        value: 3400
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: nexuspf-crm-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: nexuspf-crm-db
    databaseName: nexuspf_crm
    user: nexuspf
    plan: basic-256mb
